[build]
  publish = "."
  command = "npm run build:site"

# Storybook static build lives at /storybook/
# More specific redirects before the SPA fallback
[[redirects]]
  from = "/storybook"
  to = "/storybook/"
  status = 301

# SPA fallback only when the file is missing (Storybook files under /storybook/ are served as-is)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
  
# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/components/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/storybook/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"
    # Allow Storybook iframe embedding of its own preview
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
